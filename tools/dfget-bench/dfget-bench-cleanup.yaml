---
apiVersion: batch/v1
kind: Job
metadata:
  name: dfget-bench-cleanup
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app: dragonfly
        component: dfget-bench-cleanup
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dfget-bench-cleanup
          image: dragonflyoss/dfget-bench:latest
          imagePullPolicy: 'Always'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: '500m'
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          # The image entrypoint is "dfbench dfget-bench". cleanup disables
          # storage.keep in the dfdaemon configmaps and restarts the peer
          # daemonset and the seed peer statefulset, so they start with an
          # empty cache. It waits for both rollouts to finish.
          args:
            - 'cleanup'
            - '--namespace=dragonfly-system'
            # Same labels as the dfget-bench Job.
            - '--peer-label=component=client'
            - '--seed-peer-label=component=seed-client'
            # Names of the dfdaemon configmaps, found by the labels when not set.
            # - '--peer-configmap=client'
            # - '--seed-peer-configmap=seed-client'
            - '--timeout=1h'
          env:
            # kubectl reads the cluster credentials from the standard KUBECONFIG
            # variable, the file comes from the dfget-bench-kubeconfig secret.
            - name: KUBECONFIG
              value: /etc/kubeconfig/config
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubeconfig
              readOnly: true
            # kubectl cache, HOME is /tmp in the image.
            - name: tmp
              mountPath: /tmp
      volumes:
        # kubectl create secret generic dfget-bench-kubeconfig --from-file=config=$HOME/.kube/config
        - name: kubeconfig
          secret:
            secretName: dfget-bench-kubeconfig
        - name: tmp
          emptyDir: {}
