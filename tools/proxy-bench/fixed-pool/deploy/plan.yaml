# Place the chosen manifest on this PVC first. Paths are examples, not an enforced workspace.
# Plan generation needs neither the source server nor the Seed. Use one preparer per location; the output must be absent or contain only the empty directory skeleton.
apiVersion: batch/v1
kind: Job
metadata:
  name: fixed-pool-plan
spec:
  backoffLimit: 0
  template:
    spec:
      # Optional placement must respect the metadata PVC topology.
      # nodeSelector: {kubernetes.io/hostname: chosen-node}
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prepare
        image: dragonflyoss/fixed-pool-prepare:replace-with-build-tag
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/fixed-pool-prepare
        args:
        - plan
        - --manifest
        - /inputs/dataset-manifest.json
        - --range
        - '65536' # R: bytes per complete region; any 0 < R <= B.
        - --workers
        - '1' # W: independent workers; produce a new plan when R/W changes.
        - --out
        - /inputs/plan
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: inputs
          mountPath: /inputs
      volumes:
      - name: inputs
        persistentVolumeClaim:
          claimName: fixed-pool-inputs
